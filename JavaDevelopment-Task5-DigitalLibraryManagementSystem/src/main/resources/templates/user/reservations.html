<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Reservations - Crosq Library</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="page-container">

    <div class="page-header">
        <div>
            <h1>My Reservations</h1>
            <p>View your advance book reservations.</p>
        </div>

        <a href="/user/books" class="btn secondary-btn">
            Browse Books
        </a>
    </div>

    <div class="table-container">

        <table>

            <thead>
            <tr>
                <th>Book</th>
                <th>Author</th>
                <th>Category</th>
                <th>Reservation Date</th>
                <th>Status</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="reservation : ${reservations}">

                <td th:text="${reservation.book.title}"></td>

                <td th:text="${reservation.book.author}"></td>

                <td th:text="${reservation.book.category}"></td>

                <td th:text="${reservation.reservationDate}"></td>

                <td th:text="${reservation.status}"></td>

            </tr>

            <tr th:if="${#lists.isEmpty(reservations)}">
                <td colspan="5" class="empty-state">
                    You have no reservations.
                </td>
            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
