<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LibraNest Library - Browse Books</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="page-container library-page">

    <!-- Page Header -->
    <div class="page-header">

        <div>
            <h1>Library Catalogue</h1>

            <p>
                Welcome,
                <strong th:text="${user.fullName}">User</strong>
            </p>
        </div>

        <div class="header-actions">

            <a href="/user/dashboard" class="btn library-dashboard-btn">
                Dashboard
            </a>

            <a href="/logout" class="btn library-logout-btn">
                Logout
            </a>

        </div>

    </div>


    <!-- Search & Filter -->
    <div class="search-panel modern-search-panel">

        <form action="/user/books"
              method="get"
              class="book-search-form">

            <div class="search-field">

                <label for="keyword">
                    Search Books
                </label>

                <input type="text"
                       id="keyword"
                       name="keyword"
                       placeholder="Search by title or author"
                       th:value="${keyword}">

            </div>


            <div class="category-field">

                <label for="category">
                    Category
                </label>

                <select id="category"
                        name="category">

                    <option value="">
                        All Categories
                    </option>

                    <option th:each="cat : ${categories}"
                            th:value="${cat}"
                            th:text="${cat}"
                            th:selected="${cat == selectedCategory}">
                    </option>

                </select>

            </div>


            <button type="submit"
                    class="btn primary-btn search-btn">
                Search
            </button>

        </form>

    </div>


    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(books)}"
         class="empty-state">

        <h3>No books found</h3>

        <p>
            Try a different title, author, or category.
        </p>

    </div>


    <!-- Book Catalogue -->
    <div th:unless="${#lists.isEmpty(books)}"
         class="book-grid">

        <div class="book-card"
             th:each="book : ${books}">

            <div class="book-card-header">

                <div>
                    <h2 th:text="${book.title}">
                        Book Title
                    </h2>

                    <p class="book-author">
                        by
                        <span th:text="${book.author}">
                            Author
                        </span>
                    </p>
                </div>

                <span class="category-badge"
                      th:text="${book.category}">
                    Category
                </span>

            </div>


            <div class="book-details">

                <div class="book-detail">
                    <span class="detail-label">ISBN</span>
                    <span class="detail-value"
                          th:text="${book.isbn}">
                        ISBN
                    </span>
                </div>

                <div class="book-detail">
                    <span class="detail-label">Total Copies</span>
                    <span class="detail-value"
                          th:text="${book.totalQuantity}">
                        5
                    </span>
                </div>

                <div class="book-detail">
                    <span class="detail-label">Available</span>

                    <span class="availability-badge available-badge"
                          th:if="${book.availableQuantity > 0}"
                          th:text="${book.availableQuantity + ' available'}">
                        5 available
                    </span>

                    <span class="availability-badge unavailable-badge"
                          th:if="${book.availableQuantity == 0}">
                        Currently unavailable
                    </span>

                </div>

            </div>


            <!-- Issue Book -->
            <form th:action="@{/user/books/issue/{id}(id=${book.id})}"
                  method="post"
                  th:if="${book.availableQuantity > 0}"
                  class="book-action-form">

                <button type="submit"
                        class="btn primary-btn modern-action-btn">
                    Issue Book
                </button>

            </form>


            <!-- Reserve Book -->
            <form th:if="${book.availableQuantity == 0}"
                  th:action="@{/user/books/reserve/{id}(id=${book.id})}"
                  method="post"
                  class="book-action-form">

                <button type="submit"
                        class="btn secondary-btn modern-action-btn">
                    Reserve Book
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
