<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LibraNest Library - Add Book</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="auth-container admin-form-page">

    <div class="auth-card">

        <h1>Add New Book</h1>

        <p class="subtitle">
            Add a book to the library catalogue
        </p>

        <div th:if="${error}"
             class="error-message"
             th:text="${error}">
            Error message
        </div>

        <form action="/admin/books/add" method="post">

            <label for="title">Book Title</label>
            <input id="title"
                   type="text"
                   name="title"
                   placeholder="Enter book title"
                   required>

            <label for="author">Author</label>
            <input id="author"
                   type="text"
                   name="author"
                   placeholder="Enter author name"
                   required>

            <label for="isbn">ISBN</label>
            <input id="isbn"
                   type="text"
                   name="isbn"
                   placeholder="Enter ISBN"
                   required>

            <label for="category">Category</label>
            <input id="category"
                   type="text"
                   name="category"
                   placeholder="Enter category"
                   required>

            <label for="totalQuantity">Total Quantity</label>
            <input id="totalQuantity"
                   type="number"
                   name="totalQuantity"
                   placeholder="Enter quantity"
                   min="1"
                   required>

            <button type="submit" class="btn primary-btn">
                Add Book
            </button>

        </form>

        <a href="/admin/books" class="btn secondary-btn">
            Back to Books
        </a>

    </div>

</div>

</body>
</html>
