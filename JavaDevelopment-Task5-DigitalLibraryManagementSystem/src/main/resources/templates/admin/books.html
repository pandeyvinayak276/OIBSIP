<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Books - Digital Library</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="page-container">

    <div class="page-header">
        <div>
            <h1>Manage Books</h1>
            <p>View and manage the library catalogue.</p>
        </div>

        <div>
            <a href="/admin/dashboard" class="btn secondary-btn">Dashboard</a>
            <a href="/admin/books/add" class="btn primary-btn">+ Add Book</a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(books)}" class="empty-state">
        <h3>No books available</h3>
        <p>Add your first book to the library catalogue.</p>
    </div>

    <div th:unless="${#lists.isEmpty(books)}" class="table-container">

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>ISBN</th>
                <th>Category</th>
                <th>Total</th>
                <th>Available</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.id}">1</td>
                <td th:text="${book.title}">Book Title</td>
                <td th:text="${book.author}">Author</td>
                <td th:text="${book.isbn}">ISBN</td>
                <td th:text="${book.category}">Category</td>
                <td th:text="${book.totalQuantity}">10</td>
                <td th:text="${book.availableQuantity}">10</td>

                <td class="action-cell">

                    <a th:href="@{/admin/books/edit/{id}(id=${book.id})}"
                       class="btn small-btn">
                        Edit
                    </a>

                    <form th:action="@{/admin/books/delete/{id}(id=${book.id})}"
                          method="post"
                          style="display:inline;"
                          onsubmit="return confirm('Are you sure you want to delete this book?');">

                        <button type="submit" class="btn small-btn danger-btn">
                            Delete
                        </button>

                    </form>

                </td>
            </tr>
            </tbody>
        </table>

    </div>

</div>

</body>
</html>
