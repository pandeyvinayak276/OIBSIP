<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LibraNest Library - Manage Books</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="page-container admin-books-page">

    <div class="page-header">
        <div>
            <h1>Manage Books</h1>
            <p>View and manage the library catalogue.</p>
        </div>

        <div class="header-actions">
            <a href="/admin/dashboard" class="btn secondary-btn">
                Dashboard
            </a>

            <a href="/admin/books/add" class="btn primary-btn">
                + Add Book
            </a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(books)}" class="empty-state">
        <h3>No books available</h3>
        <p>Add your first book to the library catalogue.</p>

        <a href="/admin/books/add" class="btn primary-btn">
            + Add Book
        </a>
    </div>

    <div th:unless="${#lists.isEmpty(books)}" class="admin-books-table-container">

        <table class="admin-books-table">

            <thead>
            <tr>
                <th>ID</th>
                <th>Book</th>
                <th>Author</th>
                <th>ISBN</th>
                <th>Category</th>
                <th>Total</th>
                <th>Available</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="book : ${books}">

                <td class="book-id"
                    th:text="${book.id}">
                    1
                </td>

                <td class="book-title"
                    th:text="${book.title}">
                    Book Title
                </td>

                <td th:text="${book.author}">
                    Author
                </td>

                <td class="book-isbn"
                    th:text="${book.isbn}">
                    ISBN
                </td>

                <td>
                    <span class="book-category"
                          th:text="${book.category}">
                        Category
                    </span>
                </td>

                <td class="quantity-cell"
                    th:text="${book.totalQuantity}">
                    10
                </td>

                <td>
                    <span class="availability-count"
                          th:classappend="${book.availableQuantity > 0} ? 'available' : 'unavailable'"
                          th:text="${book.availableQuantity}">
                        10
                    </span>
                </td>

                <td class="admin-book-actions">

                    <a th:href="@{/admin/books/edit/{id}(id=${book.id})}"
                       class="admin-edit-btn">
                        Edit
                    </a>

                    <form th:action="@{/admin/books/delete/{id}(id=${book.id})}"
                          method="post"
                          onsubmit="return confirm('Are you sure you want to delete this book?');">

                        <button type="submit"
                                class="admin-delete-btn">
                            Delete
                        </button>

                    </form>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
