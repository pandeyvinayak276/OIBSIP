<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LibraNest Library - Fine Management</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="page-container admin-fines-page">

    <div class="page-header">

        <div>
            <h1>Fine Management</h1>
            <p>View and manage library fines.</p>
        </div>

        <a href="/admin/dashboard" class="btn secondary-btn">
            Back to Dashboard
        </a>

    </div>

    <div class="admin-fines-table-container">

        <table class="admin-fines-table">

            <thead>
            <tr>
                <th>Fine ID</th>
                <th>User</th>
                <th>Book</th>
                <th>Due Date</th>
                <th>Return Date</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="fine : ${fines}">

                <td class="fine-id"
                    th:text="${fine.id}">
                    1
                </td>

                <td class="fine-user"
                    th:text="${fine.issue.user.fullName}">
                    User Name
                </td>

                <td class="fine-book"
                    th:text="${fine.issue.book.title}">
                    Book Title
                </td>

                <td th:text="${fine.issue.dueDate}">
                    2026-09-15
                </td>

                <td th:text="${fine.issue.returnDate}">
                    2026-09-20
                </td>

                <td class="fine-amount">
                    ₹<span th:text="${fine.amount}">25</span>
                </td>

                <td>

                    <span class="fine-status"
                          th:classappend="${fine.status == 'PAID'} ? 'paid' : 'unpaid'"
                          th:text="${fine.status}">
                        UNPAID
                    </span>

                </td>

                <td class="fine-action">

                    <form th:if="${fine.status == 'UNPAID'}"
                          th:action="@{/admin/fines/pay/{id}(id=${fine.id})}"
                          method="post">

                        <button type="submit"
                                class="fine-pay-btn">
                            Mark as Paid
                        </button>

                    </form>

                    <span th:if="${fine.status == 'PAID'}"
                          class="fine-paid-label">
                        Paid
                    </span>

                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(fines)}">

                <td colspan="8" class="fines-empty">

                    <strong>No fines found.</strong>

                    <span>
                        Library fines will appear here when applicable.
                    </span>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
