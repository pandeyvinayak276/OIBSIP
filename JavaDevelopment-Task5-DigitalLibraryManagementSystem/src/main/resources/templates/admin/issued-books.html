<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LibraNest Library - Issued Books</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="page-container admin-issued-page">

    <div class="page-header">

        <div>
            <h1>Issued Books</h1>
            <p>View all currently issued books and due dates.</p>
        </div>

        <a href="/admin/dashboard" class="btn secondary-btn">
            Back to Dashboard
        </a>

    </div>

    <div class="admin-issued-table-container">

        <table class="admin-issued-table">

            <thead>
            <tr>
                <th>User</th>
                <th>Username</th>
                <th>Book</th>
                <th>Issue Date</th>
                <th>Due Date</th>
                <th>Status</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="issue : ${issues}">

                <td class="issued-user"
                    th:text="${issue.user.fullName}">
                    User Name
                </td>

                <td class="issued-username"
                    th:text="${issue.user.username}">
                    username
                </td>

                <td class="issued-book"
                    th:text="${issue.book.title}">
                    Book Title
                </td>

                <td th:text="${issue.issueDate}">
                    2026-09-15
                </td>

                <td class="issued-due-date"
                    th:text="${issue.dueDate}">
                    2026-09-29
                </td>

                <td>
                    <span class="issue-status"
                          th:classappend="${issue.status == 'ISSUED'} ? 'active' : 'returned'"
                          th:text="${issue.status}">
                        ISSUED
                    </span>
                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(issues)}">
                <td colspan="6" class="issued-empty">
                    <strong>No books are currently issued.</strong>
                    <span>Issued books will appear here when users borrow books.</span>
                </td>
            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
