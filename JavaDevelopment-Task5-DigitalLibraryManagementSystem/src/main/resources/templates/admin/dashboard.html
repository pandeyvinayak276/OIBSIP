<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Library - Admin Dashboard</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>Admin Dashboard</h1>

        <p class="subtitle">
            Welcome, <strong th:text="${user.fullName}">Administrator</strong>
        </p>

        <p>
            You are logged in as:
            <strong th:text="${user.role}">ADMIN</strong>
        </p>

        <br>

        <a href="/admin/books" class="btn primary-btn admin-btn">
            Manage Books
        </a>

        <br><br>

        <button type="button" class="admin-btn">Issued Books</button>

        <br><br>

        <button type="button" class="admin-btn">Members</button>

        <br><br>

        <button type="button" class="admin-btn">Fines</button>

        <br><br>

        <button type="button" class="admin-btn">Contact Messages</button>

        <br><br>

        <a href="/logout" class="btn secondary-btn admin-btn">
            Logout
        </a>

    </div>

</div>

</body>
</html>
