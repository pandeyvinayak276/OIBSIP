<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Members - Crosq Library</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="page-container">

    <div class="page-header">
        <div>
            <h1>Registered Members</h1>
            <p>View all registered library accounts.</p>
        </div>

        <a href="/admin/dashboard" class="btn secondary-btn">
            Back to Dashboard
        </a>
    </div>

    <div class="table-container">

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Username</th>
                <th>Role</th>
                <th>Registered On</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="member : ${users}">

                <td th:text="${member.id}"></td>

                <td th:text="${member.fullName}"></td>

                <td th:text="${member.username}"></td>

                <td th:text="${member.role}"></td>

                <td th:text="${member.createdAt}"></td>

            </tr>

            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="5" class="empty-state">
                    No registered members found.
                </td>
            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
