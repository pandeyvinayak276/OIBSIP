<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LibraNest Library - Members</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="page-container admin-members-page">

    <div class="page-header">

        <div>
            <h1>Registered Members</h1>
            <p>View all registered library accounts.</p>
        </div>

        <a href="/admin/dashboard" class="btn secondary-btn">
            Back to Dashboard
        </a>

    </div>

    <div class="admin-members-table-container">

        <table class="admin-members-table">

            <thead>
            <tr>
                <th>ID</th>
                <th>Member</th>
                <th>Username</th>
                <th>Role</th>
                <th>Registered On</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="member : ${users}">

                <td class="member-id"
                    th:text="${member.id}">
                    1
                </td>

                <td class="member-name"
                    th:text="${member.fullName}">
                    Member Name
                </td>

                <td class="member-username"
                    th:text="${member.username}">
                    username
                </td>

                <td>
                    <span class="member-role"
                          th:classappend="${member.role == 'ADMIN'} ? 'admin' : 'user'"
                          th:text="${member.role}">
                        USER
                    </span>
                </td>

                <td class="member-date"
                    th:text="${member.createdAt}">
                    2026-09-15
                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="5" class="members-empty">
                    <strong>No registered members found.</strong>
                    <span>Registered library accounts will appear here.</span>
                </td>
            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
